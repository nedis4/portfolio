    window.addEventListener("load", measure, { once: true });
    setTimeout(measure, 400);
    return {
      measure: measure,
      update: function () {
        if (reduced) return;
        var r = figure.getBoundingClientRect();
        var vh = window.innerHeight;
        // Start decoding well before the sequence is reached. Each frame costs
        // ~150ms at full resolution, so the head start is what decides whether
        // the opening of the scrub — the part every visitor sees — is already
        // decoded or is being chased. Only affects when work begins; the scroll
        // mapping and the frames themselves are untouched.
        if (r.top < vh * 6 && r.bottom > -vh) startPrefetch();
        if (r.top < vh * 3 && r.bottom > -vh * 0.5) pump();
        var p = Math.min(1, Math.max(0, (stickyTopPx - r.top) / travel));
        // Freeze the drafting grid while scrubbing WITHOUT per-frame JS (which
        // jitters against compositor scroll): flip the background to viewport-
        // fixed for the pin, back to scrolling at the last frame. bg-position is
        // realigned (mod the 160px grid) at each flip so there's no visible jump.
        var scrubbing = p > 0 && p < 1;
        if (scrubbing && !gridFrozen) {
          // Show the FIXED grid layer (iOS honors position:fixed, but ignores
          // background-attachment:fixed) aligned to the body grid, and hide the
          // body grid — so the grid sits still on every browser, no jitter.
          var s0 = window.scrollY || 0;
          gridF = (((gridB - s0) % 160) + 160) % 160;
          if (gridLayer) { gridLayer.style.backgroundPositionY = gridF + "px"; gridLayer.style.opacity = "1"; }
          document.body.style.backgroundImage = "none";
          gridFrozen = true;
        } else if (!scrubbing && gridFrozen) {
          var s1 = window.scrollY || 0;
          gridB = (((gridF + s1) % 160) + 160) % 160;
          document.body.style.backgroundImage = "";
          document.body.style.backgroundPositionY = gridB + "px";
          if (gridLayer) gridLayer.style.opacity = "0";
          gridFrozen = false;
        }
        if (hdr && hdr.ready()) { hdr.seek(p); return; }   // HDR: the video is the picture
        var nw = Math.round(p * (n - 1));
        if (nw !== want) { scrubDir = nw > want ? 1 : -1; want = nw; }
        // Paint synchronously from the decoded cache — no decode, no rAF
        // chain, no layer swap. The draw is a GPU blit of an already
        // display-sized bitmap, so it keeps up with the compositor.
        if (want !== cur) { paintNearest(want); pump(); }
      }
    };
  }

  /* ── horizontal project scroll. Desktop: strip is overflow:hidden so vertical
     wheel stays native (page scrolls, never trapped); horizontal pan = drag +
     a passive wheel handler. Touch: native overflow-x:auto finger-swipe. ── */
  function initHStrip(wrap) {
    var view = wrap.querySelector(".proj-h-view");
    if (!view) return;
    var barEl = wrap.querySelector(".proj-h-bar");
    var fill = wrap.querySelector(".hbar-fill");
    var reset = wrap.querySelector(".proj-h-reset");
    var countEl = wrap.querySelector(".proj-h-count");
    // counted from the live DOM (not passed in) so this stays correct even if
    // the panel markup changes later — one source of truth
    var panelCount = wrap.querySelectorAll(".hpanel").length;
    // click-and-drag to pan (mouse); native trackpad / shift-wheel also work
    var down = false, startX = 0, startLeft = 0, moved = false, pid = 0;
    view.addEventListener("pointerdown", function (e) {
      // Where the strip scrolls natively by touch (overflow-x:auto via the
      // coarse-pointer media query), let it. Everywhere else — including
      // hybrid touchscreen laptops, which get the desktop overflow:hidden —
      // JS drives touch pans too (touch-action:pan-y keeps vertical native).
      if (e.pointerType === "touch" && getComputedStyle(view).overflowX === "auto") return;
      down = true; moved = false; startX = e.clientX; startLeft = view.scrollLeft; pid = e.pointerId;
      // NB: don't setPointerCapture here — capturing on pointerdown retargets the
      // follow-up click to this view, so clicks on children (e.g. the expand
      // button) never reach them. Capture only once a real drag begins.
    });
    view.addEventListener("pointermove", function (e) {
      if (!down) return;
      // released outside the strip before capture kicked in (≤3px move) —
      // don't keep panning on a button-less re-entry
      if (e.pointerType === "mouse" && e.buttons === 0) return end();
      var dx = e.clientX - startX;
      if (!moved && Math.abs(dx) > 3) {
        moved = true;
        view.classList.add("dragging");
        try { view.setPointerCapture(pid); } catch (err) {}
      }
      if (moved) view.scrollLeft = startLeft - dx;
    });
    function end() { down = false; view.classList.remove("dragging"); }
    view.addEventListener("pointerup", end);
    view.addEventListener("pointercancel", end);
    // Belt-and-suspenders with draggable="false": cancel any native drag (image
    // ghost, text selection) so a click-and-drag pan works over photos too.
    view.addEventListener("dragstart", function (e) { e.preventDefault(); });
    // The strip is overflow:hidden on desktop (see CSS), so vertical wheel is
    // left FULLY native — it passes straight to the page, keeping its momentum
    // and never getting trapped, mid-strip or at the ends. We only step in for
    // horizontal-intent wheels (shift-wheel / horizontal trackpad) to pan the
    // strip. Passive (no preventDefault) → zero cost to the native vertical path.
    view.addEventListener("wheel", function (e) {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) view.scrollLeft += e.deltaX;
    }, { passive: true });
    // keyboard access: the strip is overflow:hidden on desktop, so without this
    // a keyboard-only user has no way to pan it (programmatic scroll still works
    // on hidden overflow). Tab to the strip, then arrow keys.
    view.setAttribute("tabindex", "0");
    view.setAttribute("role", "region");
    view.setAttribute("aria-label", t("stripAria"));
    view.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      view.scrollBy({ left: e.key === "ArrowRight" ? 260 : -260, behavior: "smooth" });
    });
    // a pan shouldn't register as a click on whatever was under the cursor
    view.addEventListener("click", function (e) { if (moved) { e.preventDefault(); e.stopPropagation(); } }, true);
    // built-in horizontal progress bar + back-to-start (per modusforma)
    function bar() {
      var max = view.scrollWidth - view.clientWidth;
      var p = max > 0 ? Math.min(1, Math.max(0, view.scrollLeft / max)) : 0;
      if (fill) fill.style.clipPath = "inset(0 " + ((1 - p) * 100).toFixed(2) + "% 0 0)";
      if (reset) reset.classList.toggle("show", view.scrollLeft > 8);
      if (countEl && panelCount > 1) {
        var idx = Math.min(panelCount, Math.round(p * (panelCount - 1)) + 1);
        countEl.textContent = String(idx).padStart(2, "0") + " / " + String(panelCount).padStart(2, "0");
      }
    }
    view.addEventListener("scroll", bar, { passive: true });
    window.addEventListener("resize", bar);
    bar();
    if (reset) reset.addEventListener("click", function () {
      view.scrollTo({ left: 0, behavior: "smooth" });
    });
    // click anywhere on the progress line to jump to that position
    if (barEl) barEl.addEventListener("click", function (e) {
      var max = view.scrollWidth - view.clientWidth;
      var r = barEl.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      view.scrollTo({ left: ratio * max, behavior: "smooth" });
    });
  }

  /* ── full-size image viewer: opens a flagged image at 1:1, scrollable.
     Built once, lazily, then reused. Drag-to-pan + wheel/scrollbar + Esc. ── */
  function initLightbox() {
    var box = document.createElement("div");
    box.className = "lightbox";
    box.setAttribute("hidden", "");
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    box.setAttribute("aria-label", t("lbAria"));
    box.innerHTML =
      '<div class="lightbox-bar">' +
      '<span class="lightbox-cap"><span class="lb-label"></span>' +
      '<span class="lb-coords t-mono"></span></span>' +
      '<span class="lightbox-actions">' +
      '<button class="lightbox-zoom hd-box" type="button"></button>' +
      '<button class="lightbox-close hd-box" type="button" aria-label="' + attr(t("lbCloseAria")) + '">' + esc(t("lbClose")) + '</button>' +
      '</span>' +
      '</div>' +
      // tabindex → the scroll region is keyboard-reachable, so arrow keys pan the image
      '<div class="lightbox-scroll" tabindex="0" aria-label="' + attr(t("lbScrollAria")) + '"><img class="lightbox-img" alt="" draggable="false"></div>';
    document.body.appendChild(box);

    var scroll = box.querySelector(".lightbox-scroll");
    var img = box.querySelector(".lightbox-img");
    var lbLabel = box.querySelector(".lb-label");
    var lbCoords = box.querySelector(".lb-coords");
    var zoomBtn = box.querySelector(".lightbox-zoom");
    var lastFocus = null;
    var fitMode = false;
    // phones/tablets: an oversized image opening at 1:1 is disorienting (you
    // need to scroll both axes to even see it once). Default those to
    // fit-to-width; desktop keeps the "see every pixel" 1:1 default. Either
    // is one tap/click away via the toggle button.
    var TOUCH_OR_SMALL = "(max-width: 760px), (hover: none) and (pointer: coarse)";

    function setFit(fit) {
      fitMode = fit;
      box.classList.toggle("lb-fit", fit);
      zoomBtn.textContent = fit ? "1:1" : t("lbFit");
      zoomBtn.setAttribute("aria-label", fit ? t("lbTo11Aria") : t("lbToFitAria"));
    }
    zoomBtn.addEventListener("click", function () {
      setFit(!fitMode);
      scroll.scrollTop = 0; scroll.scrollLeft = 0;
    });

    function open(full, label, coords) {
      img.src = full; img.alt = label || "";
      lbLabel.textContent = label || "";
      lbCoords.textContent = coords ? " · " + coords : "";
      box.removeAttribute("hidden");
      // locked on BOTH html and body: html is the page's actual scroller (its
      // overflow-y is auto), so body.lb-open alone left the page scrollable
      // behind the lightbox — the wheel-bleed bug.
      document.documentElement.classList.add("lb-open");
      document.body.classList.add("lb-open");
      setFit(window.matchMedia(TOUCH_OR_SMALL).matches);
      // start at the top-left so tall/wide images reveal from a known origin
      scroll.scrollTop = 0; scroll.scrollLeft = 0;
      lastFocus = document.activeElement;
      box.querySelector(".lightbox-close").focus();
    }
    function close() {
      box.setAttribute("hidden", "");
      document.documentElement.classList.remove("lb-open");
      document.body.classList.remove("lb-open");
      img.removeAttribute("src");
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    box.querySelector(".lightbox-close").addEventListener("click", close);
    // click on the dimmed backdrop (not the image) closes
    scroll.addEventListener("click", function (e) { if (e.target === scroll) close(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !box.hasAttribute("hidden")) close();
    });
    // focus trap: aria-modal alone doesn't stop Tab from wandering into the
    // page behind — cycle between the three focusables (zoom → close → image)
    box.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      var first = zoomBtn, last = scroll;
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    // drag-to-pan inside the viewer (mouse) — same gesture as the strip
    var down = false, sx = 0, sy = 0, stop = 0, slft = 0, moved = false;
    scroll.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "touch") return;
      down = true; moved = false; sx = e.clientX; sy = e.clientY;
      stop = scroll.scrollTop; slft = scroll.scrollLeft;
      scroll.classList.add("dragging");
      try { scroll.setPointerCapture(e.pointerId); } catch (err) {}
    });
    scroll.addEventListener("pointermove", function (e) {
      if (!down) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      scroll.scrollTop = stop - dy; scroll.scrollLeft = slft - dx;
    });
    function pend() { down = false; scroll.classList.remove("dragging"); }
    scroll.addEventListener("pointerup", pend);
    scroll.addEventListener("pointercancel", pend);
    scroll.addEventListener("dragstart", function (e) { e.preventDefault(); });

    // delegated open trigger. The strip's capture-phase click handler already
    // swallows clicks that were really pans, so a drag never opens the viewer.
    document.addEventListener("click", function (e) {
      var btn = e.target.closest && e.target.closest(".media-expand");
      if (!btn) return;
      e.preventDefault();
      open(btn.getAttribute("data-full"), btn.getAttribute("data-label"), btn.getAttribute("data-coords"));
    });
  }

  /* ── scroll-driven systems ────────────────────────────────────── */
  function wire() {
    var topbarEl = document.getElementById("topbar");
    var progPath = document.getElementById("prog-path");
    var spyLinks = [].slice.call(document.querySelectorAll("[data-spy]"));
    var pnav = document.getElementById("pnav");
    var pnavItems = [].slice.call(document.querySelectorAll("[data-pnav]"));
    var hls = [].slice.call(document.querySelectorAll(".hyperlapse")).map(initHyperlapse);
    var scrollers = hls;
    [].slice.call(document.querySelectorAll(".proj-h")).forEach(initHStrip);
    initLightbox();
    // cache element refs once — getElementById on every scroll frame (4
    // sections + work + 6 projects) was needless per-frame churn.
    var sectionEls = SECTIONS.map(function (s) { return document.getElementById(s.id); });
    var workEl = document.getElementById("work");
    var projectEls = PROJECTS.map(function (p) { return document.getElementById(p.id); });

    // reveal + draw-on-scroll
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { threshold: 0.16, rootMargin: "0px 0px -6% 0px" });
    document.querySelectorAll(".reveal, .draw, .lang-row").forEach(function (n) { io.observe(n); });

    // project-nav: jump on click (li made focusable → Enter/Space work too)
    pnavItems.forEach(function (li) {
      li.setAttribute("tabindex", "0");
      li.setAttribute("role", "button");
      li.addEventListener("click", function () {
        var t = document.getElementById(li.getAttribute("data-pnav"));
        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      li.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); li.click(); }
      });
    });

    // contact links assembled on click → no clickable address sits in the DOM
    // (scheme split so the literal token isn't greppable in the source either)
    document.querySelectorAll(".js-mail").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); location.href = "mai" + "lto:" + EMAIL; });
    });
    document.querySelectorAll(".js-tel").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        // Read the number off the link itself rather than a single shared
        // constant, so every tel link dials the number it actually shows.
        var n = (a.textContent || "").replace(/\s/g, "");
        location.href = "te" + "l:" + (n || PHONE.replace(/\s/g, ""));
      });
    });
    // copy buttons (value assembled from key, never stored in a DOM attribute).
    // navigator.clipboard only exists in secure contexts (https/localhost) —
    // fall back to a hidden textarea + execCommand elsewhere, and only show
    // "copied!" when the write actually succeeded.
    function copyText(t) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
      return new Promise(function (res, rej) {
        var ta = document.createElement("textarea");
        ta.value = t; ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        ok ? res() : rej(new Error("copy failed"));
      });
    }
    document.querySelectorAll("[data-ck]").forEach(function (b) {
      b.addEventListener("click", function () {
        var row = b.closest(".contact-row");
        var shown = row && row.querySelector(".v") ? row.querySelector(".v").textContent.trim() : "";
        copyText(shown || (b.getAttribute("data-ck") === "email" ? EMAIL : PHONE)).then(function () {
          var prev = b.textContent; b.textContent = t("copied"); b.classList.add("did");
          setTimeout(function () { b.textContent = prev; b.classList.remove("did"); }, 1400);
        }, function () {});
      });
    });
    var totop = document.getElementById("totop");
    if (totop) totop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

    // Theme. The inline script in <head> has already applied the stored (or
    // system) choice before first paint; this keeps the buttons, the browser
    // chrome colour and later system changes in step with it.
    var rootEl = document.documentElement;
    var themeMeta = document.querySelector('meta[name="theme-color"]');
    var themeBtns = [].slice.call(document.querySelectorAll(".js-theme"));
    function storedTheme() { try { return localStorage.getItem("mb-theme"); } catch (e) { return null; } }
    function applyTheme(th) {
      rootEl.setAttribute("data-theme", th);
      // read back from the stylesheet so the palette has one source of truth
      var paper = getComputedStyle(rootEl).getPropertyValue("--paper").trim();
      if (themeMeta && paper) themeMeta.setAttribute("content", paper);
      themeBtns.forEach(function (b) {
        b.setAttribute("aria-label", t(th === "dark" ? "themeToLight" : "themeToDark"));
      });
    }
    applyTheme(rootEl.getAttribute("data-theme") === "dark" ? "dark" : "light");
    themeBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var next = rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
        try { localStorage.setItem("mb-theme", next); } catch (e) {}
        applyTheme(next);
      });
    });
    // follow the system setting live, until the visitor has chosen for themselves
    var schemeMq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (schemeMq) {
      var onScheme = function (e) { if (!storedTheme()) applyTheme(e.matches ? "dark" : "light"); };
      if (schemeMq.addEventListener) schemeMq.addEventListener("change", onScheme);
      else if (schemeMq.addListener) schemeMq.addListener(onScheme);
    }
    // language menus: <details> only closes on its own summary, so close it on
    // an outside click, on Escape (focus back to the summary) and when focus
    // leaves it. Written for every copy; only one is ever displayed.
    var langMenus = [].slice.call(document.querySelectorAll(".lang-menu"));
    document.addEventListener("click", function (e) {
      langMenus.forEach(function (m) { if (!m.contains(e.target)) m.open = false; });
    });
    langMenus.forEach(function (m) {
      m.addEventListener("keydown", function (e) {
        if (e.key !== "Escape" || !m.open) return;
        m.open = false;
        m.querySelector("summary").focus();
      });
      m.addEventListener("focusout", function (e) {
        if (e.relatedTarget && !m.contains(e.relatedTarget)) m.open = false;
      });
    });
    var langLinks = [].slice.call(document.querySelectorAll(".js-lang"));
    var lastAnchor = "";
    var shownSection = null, shownProject = null;   // what the nav highlights currently say

    var ticking = false;
    function onScroll() {
      if (ticking) return; ticking = true;
      requestAnimationFrame(function () {
        ticking = false;
        var doc = document.documentElement;
        var sc = window.scrollY || doc.scrollTop || 0;
        var vh = window.innerHeight;
        var max = doc.scrollHeight - doc.clientHeight;
        // The scrubber goes first. It measures its own position, and doing
        // that after the style writes further down made the browser recompute
        // style in the middle of every scroll frame just to answer it.
        for (var hi = 0; hi < scrollers.length; hi++) scrollers[hi].update();

        // ── reads (cached refs) ──
        var y = sc + 130, curId = SECTIONS[0].id;
        for (var i = 0; i < sectionEls.length; i++) {
          if (sectionEls[i] && sectionEls[i].offsetTop <= y) curId = SECTIONS[i].id;
        }
        var workRect = workEl ? workEl.getBoundingClientRect() : null;
        var bestId = PROJECTS[0] && PROJECTS[0].id;
        if (workRect) {
          var target = vh * 0.4, bestD = Infinity;
          for (var j = 0; j < projectEls.length; j++) {
            var el = projectEls[j]; if (!el) continue;
            var rt = el.getBoundingClientRect().top, dist = Math.abs(rt - target);
            if (rt <= target + 220 && dist < bestD) { bestD = dist; bestId = PROJECTS[j].id; }
          }
        }
        // Where a language switch should land: the project being read while in
        // the work section, otherwise the section itself; nothing near the top.
        var anchor = sc < vh * 0.5 ? "" : (curId === "work" && bestD < Infinity ? bestId : curId);

        // ── writes ──
        if (progPath) progPath.style.strokeDashoffset = String(1 - (max > 0 ? sc / max : 0));
        if (topbarEl) topbarEl.classList.toggle("is-stuck", sc > 10);
        // these only change a handful of times over the whole page — don't
        // walk ten elements on every frame to re-assert what they already say
        if (curId !== shownSection) {
          shownSection = curId;
          spyLinks.forEach(function (a) { a.classList.toggle("active", a.getAttribute("data-spy") === curId); });
        }
        if (pnav && bestId !== shownProject) {
          shownProject = bestId;
          pnavItems.forEach(function (li) { li.classList.toggle("is-active", li.getAttribute("data-pnav") === bestId); });
        }
        if (anchor !== lastAnchor) {
          lastAnchor = anchor;
          langLinks.forEach(function (a) {
            a.setAttribute("href", a.getAttribute("data-href") + (anchor ? "#" + anchor : ""));
          });
        }
      });
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", function () {
      for (var i = 0; i < scrollers.length; i++) scrollers[i].measure();
      onScroll();
    });
    onScroll();
  }

  /* ── mount ────────────────────────────────────────────────────── */
  function mount() {
    var root = document.getElementById("root");
    root.innerHTML =
      '<a class="skip-link" href="#main">' + esc(t("skip")) + '</a>' +
      '<div class="grid-freeze" aria-hidden="true"></div>' +
      '<div class="progress">' + D.progress() + '</div>' +
      topbar() +
      // tabindex="-1": makes the jump target itself focusable, so activating
      // the skip link continues Tab order from here instead of restarting at
      // the top of the document (anchor-jump alone doesn't move focus)
      '<main class="page" id="main" tabindex="-1">' + hero() + about() + work() + cv() + contact() + '</main>' +
      colophon();
    wire();
    // A language switch (or any deep link) arrives with an #anchor. Its target
    // only exists now that the page has rendered, and html{scroll-behavior:
    // smooth} would otherwise animate the whole way down from the top.
    if (location.hash.length > 1) {
      var target = null;
      try { target = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
      if (target) {
        try { target.scrollIntoView({ behavior: "instant", block: "start" }); }
        catch (e) { target.scrollIntoView(); }   // browsers without "instant"
      }
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
  else mount();
})();

</script>
</body>
</html>
