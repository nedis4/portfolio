:root {
  color-scheme: light;
  --paper: #fcfbf7;
  --paper-2: #f4f1e9;
  --ink: #232220;
  --ink-soft: #56544d;
  --ink-faint: #767369;  /* AA: ≥4.5:1 on --paper (was #8e8b81 ≈ 3.1:1 — failed for the 10px meta text) */
  --red: #cf3a1b;
  --blue: #5b89b4;
  /* The same three colours as bare channels. Every translucent tint below is
     written rgba(var(--x-rgb), a), so it follows the theme instead of baking
     in the daylight palette. Keep each in step with its hex twin above. */
  --paper-rgb: 252, 251, 247;
  --red-rgb: 207, 58, 27;
  --blue-rgb: 91, 137, 180;
  --red-soft: rgba(var(--red-rgb), 0.08);
  --grid: rgba(var(--blue-rgb), 0.085);
  --grid-major: rgba(var(--blue-rgb), 0.16);
  --tape: rgba(232, 221, 184, 0.88);
  --rule: #ddd8cb;

  --sans: "Space Grotesk", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --hand: "Caveat", "Bradley Hand", "Segoe Script", cursive;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  /* the classic hand-drawn rectangle trick */
  --wobble: 255px 15px 225px 15px / 15px 225px 15px 255px;
  --wobble-2: 15px 225px 15px 255px / 255px 15px 225px 15px;

  --gutter: clamp(20px, 5vw, 64px);
  --topbar-h: 64px;
}

/* ─── Dark theme · the worktable after hours ─────────────────────────
   Same vocabulary on an inverted ground: graphite sheet, chalk ink, and the
   red pencil lifted a step — the daylight red is only 3.7:1 on this sheet,
   this one is 5.2:1, so the 10px stamps still pass AA. Switched by
   data-theme on <html>; the inline script in <head> applies the visitor's
   stored choice, or else their system setting, before first paint.
   Screen only: print always falls through to the paper palette above. */
@media screen {
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #171614;
    --paper-2: #211f1c;
    --ink: #ece8de;
    --ink-soft: #b9b4a8;
    --ink-faint: #918d82;
    --red: #ec5c38;
    --blue: #7fa8cf;
    --paper-rgb: 23, 22, 20;
    --red-rgb: 236, 92, 56;
    --blue-rgb: 127, 168, 207;
    --grid: rgba(var(--blue-rgb), 0.06);
    --grid-major: rgba(var(--blue-rgb), 0.12);
    --tape: rgba(205, 192, 150, 0.8);
    --rule: #3a3731;
  }
  [data-theme="dark"] .lightbox { background: rgba(8, 8, 7, 0.95); }
}

/* Ukrainian. Space Grotesk has no Cyrillic, so with the default stack the
   page would switch typeface mid-line — Space Grotesk for every Latin name,
   a fallback for everything else. Onest (embedded on this page only, see
   build.py) carries both scripts, so the text face is uniform; Space Grotesk
   stays for the name, which is set in Latin. The handwritten notes need no
   override: Caveat's Cyrillic subset is embedded under the same family. */
:root:lang(uk) {
  --sans: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
:lang(uk) .hero h1, :lang(uk) .brand > span:first-child { font-family: "Space Grotesk", var(--sans); }

/* German compounds and Ukrainian words run long. Nothing may overflow its
   column, so everything gets the last-resort break; real hyphenation is kept
   to the narrow columns (the strip's text panels, and phones — see ≤760px),
   because in a full-width paragraph it only chops words that had room. */
:lang(de) :is(p, li, .v, .role, .subtitle, h2, h3),
:lang(uk) :is(p, li, .v, .role, .subtitle, h2, h3) { overflow-wrap: break-word; }
:lang(de) .hpanel :is(p, li, .v), :lang(uk) .hpanel :is(p, li, .v) { -webkit-hyphens: auto; hyphens: auto; }

* { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  overscroll-behavior-x: contain;  /* block swipe-back nav at the root, so the strips don't need to (see .proj-h-view) */
  /* Decorative bleed elements leave ~50px of stray horizontal overflow. Harmless
     until the strips became overflow:hidden — now their horizontal-pan wheel
     events bubble to the document and scroll/bounce that overflow, jerking the
     whole page. Lock horizontal scroll at the viewport. NB: needs BOTH this and
     body's overflow-x:clip — neither alone fully stops it (verified). Sticky-safe:
     html is already the viewport scroller, body uses clip (no new container). */
  overflow-x: hidden;
}
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.62;
  background-color: var(--paper);
  /* 5mm drafting grid + major lines */
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 160px 160px, 160px 160px, 32px 32px, 32px 32px;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;   /* paired with html's overflow-x:hidden — BOTH are needed to
                         fully lock the page's stray horizontal scroll. clip here
                         (not hidden) creates no scroll container, so sticky is safe. */
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
p { margin: 0 0 1em; }
h1, h2, h3, h4 { margin: 0; line-height: 1.08; font-weight: 700; letter-spacing: -0.015em; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
::selection { background: var(--red); color: var(--paper); }

.page { max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); }

/* ─── Type utilities ─────────────────────────────────────────────── */
.t-mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--ink-soft); }
.t-mono-sm { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
.t-hand { font-family: var(--hand); font-size: 22px; font-weight: 500; line-height: 1.15; color: var(--red); letter-spacing: 0; }
.t-hand--ink { color: var(--ink-soft); }
.t-hand--lg { font-size: clamp(26px, 3.4vw, 34px); }
/* visually hidden, still read by screen readers (headings, labels) */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0;
}
/* keyboard users otherwise have to tab through the whole topbar nav on every
   page load before reaching real content — parked off-screen, slides into
   view on focus */
.skip-link {
  position: fixed; top: 10px; left: 10px; z-index: 100;
  padding: 10px 18px;
  background: var(--paper);
  border: 1.6px solid var(--ink);
  border-radius: var(--wobble);
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  translate: 0 -80px;
  transition: translate 0.15s ease;
}
.skip-link:focus { translate: 0 0; }
#main:focus { outline: none; }  /* tabindex="-1" target — no visible ring needed around the whole landmark */

/* ─── Hand-drawn boxes, stamps, tape ─────────────────────────────── */
.hd-box {
  display: inline-block;
  border: 1.6px solid var(--ink);
  border-radius: var(--wobble);
  padding: 9px 18px;
  background: var(--paper);
  transition: background 0.18s ease, color 0.18s ease, rotate 0.18s ease;
}
.hd-box:hover { background: var(--ink); color: var(--paper); }
a.hd-box, button.hd-box { cursor: pointer; }

.stamp {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--red);
  border: 2px solid var(--red);
  border-radius: 7px;
  padding: 7px 11px 6px;
  rotate: -2.5deg;
  opacity: 0.92;
  text-shadow: 0.4px 0.4px 0 rgba(var(--red-rgb), 0.35);
  box-shadow: inset 0 0 0 0.6px rgba(var(--red-rgb), 0.5);
  background:
    radial-gradient(circle at 30% 60%, rgba(var(--paper-rgb), .35) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 30%, rgba(var(--paper-rgb), .3) 0 2px, transparent 3px);
}

.tape {
  position: absolute;
  width: 92px;
  height: 26px;
  background: var(--tape);
  box-shadow: 0 1px 3px rgba(35, 34, 32, 0.12);
  clip-path: polygon(3% 8%, 97% 0%, 100% 88%, 95% 100%, 4% 95%, 0% 82%);
  z-index: 2;
  pointer-events: none;
}
.tape--tl { top: -12px; left: 18px; rotate: -5deg; }
.tape--tr { top: -12px; right: 18px; rotate: 4deg; }

/* ─── Doodle SVG + draw-on-scroll system ─────────────────────────── */
.doodle { display: block; overflow: visible; }
.doodle path, .doodle line, .doodle circle, .doodle ellipse, .doodle polyline {
  fill: none;
  stroke: var(--red);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.doodle--ink path, .doodle--ink line, .doodle--ink circle, .doodle--ink polyline { stroke: var(--ink); }
.doodle--thin path, .doodle--thin line { stroke-width: 1.6; }

/* every path carries pathLength="1" → no JS measuring needed */
.draw path, .draw line, .draw circle, .draw ellipse, .draw polyline {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  transition: stroke-dashoffset 0.9s cubic-bezier(0.45, 0, 0.2, 1);
  transition-delay: var(--d, 0ms);
}
.draw.in path, .draw.in line, .draw.in circle, .draw.in ellipse, .draw.in polyline,
.in > .draw path, .in > .draw line, .in > .draw circle, .in > .draw polyline {
  stroke-dashoffset: 0;
}

/* fade/rise reveal */
.reveal { opacity: 0; translate: 0 16px; transition: opacity 0.65s ease, translate 0.65s ease; transition-delay: var(--d, 0ms); }
.reveal.in { opacity: 1; translate: 0 0; }

@keyframes wiggle {
  0%, 100% { rotate: 0deg; }
  30% { rotate: 0.9deg; }
  70% { rotate: -0.9deg; }
}
.wiggle:hover { animation: wiggle 0.34s ease-in-out; }

/* ─── Pencil progress line ───────────────────────────────────────── */
.progress {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 10px;
  z-index: 90;
  pointer-events: none;
}
.progress svg { width: 100%; height: 10px; display: block; }
.progress path {
  fill: none;
  stroke: var(--red);
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1; /* driven by JS: 1 → 0 */
}

/* ─── Topbar ─────────────────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: var(--topbar-h);
  padding: 8px var(--gutter);
  background: rgba(var(--paper-rgb), 0.88);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1.5px solid transparent;
  transition: border-color 0.25s ease;
}
.topbar.is-stuck { border-bottom-color: var(--ink); }
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.01em;
}
.brand .t-hand { font-size: 19px; translate: 0 -2px; }
.topbar nav { display: flex; align-items: center; gap: 6px; }
.topbar nav a {
  position: relative;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 13px 12px;
}
.topbar nav a.active { color: var(--ink); }
.topbar nav .pill { margin-left: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 16px; }

/* ─── Language + theme controls ──────────────────────────────────── */
/* The language control is a compact <details> menu, in the topbar's left group
   next to the brand and again in the hero for narrow screens; the footer has
   room for the inline list. The theme toggle stays in the topbar's nav. Phones
   have no room in the sticky bar, so there the hero copy takes over (see the
   responsive block). */
.topbar-l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tools { display: flex; align-items: center; gap: 2px; }
.tools--hero { display: none; }
.topbar nav .tools { margin-left: 8px; }
.langs { display: flex; align-items: center; }
.langs a, .langs span {
  position: relative;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 13px 7px;
  transition: color 0.15s ease;
}
.langs a:hover { color: var(--ink); }
.langs .is-current { color: var(--ink); font-weight: 700; }
/* a red-pencil tick under the language you are reading */
.langs .is-current::after {
  content: "";
  position: absolute; left: 6px; right: 7px; bottom: 9px;
  height: 1.6px; border-radius: 2px;
  background: var(--red);
  rotate: -2deg;
}
/* compact menu: current code + chevron; the list opens as a small paper panel
   under it (z-index comes from the sticky topbar's stacking context) */
.lang-menu { position: relative; }
.lang-menu summary {
  display: flex; align-items: center; gap: 5px;
  list-style: none;            /* Firefox */
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 13px 8px;
  transition: color 0.15s ease;
}
.lang-menu summary::-webkit-details-marker { display: none; }   /* Safari/Chrome */
.lang-menu summary:hover, .lang-menu[open] summary { color: var(--ink); }
.lang-caret { width: 11px; height: 7px; flex-shrink: 0; }
.lang-caret path { stroke: currentColor; stroke-width: 1.6; }
.lang-menu[open] .lang-caret { scale: 1 -1; }
.lang-panel {
  position: absolute; top: 100%; left: 0;
  display: flex; flex-direction: column; gap: 2px;
  min-width: 150px;
  padding: 6px;
  background: var(--paper);
  border: 1.6px solid var(--ink);
  border-radius: var(--wobble);
}
.lang-panel a, .lang-panel .is-current { display: flex; align-items: baseline; gap: 12px; padding: 8px 10px; }
.lm-code { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); transition: color 0.15s ease; }
.lm-name { font-family: var(--sans); font-size: 13px; color: var(--ink-soft); }
.lang-panel .is-current .lm-code { font-weight: 700; }
.lang-panel a:hover .lm-code, .lang-panel a:focus-visible .lm-code { color: var(--red); }
.theme-toggle { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; }
.theme-toggle .doodle { grid-area: 1 / 1; width: 19px; height: 19px; }
.theme-toggle .doodle path { stroke: var(--ink-soft); stroke-width: 1.7; transition: stroke 0.15s ease; }
.theme-toggle:hover .doodle path { stroke: var(--red); }
/* the icon is the theme a click switches TO */
.theme-toggle .ico-sun { display: none; }
[data-theme="dark"] .theme-toggle .ico-sun { display: block; }
[data-theme="dark"] .theme-toggle .ico-moon { display: none; }
.lang-menu summary:focus-visible, .lang-panel a:focus-visible, .theme-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: -3px; }

/* ─── Hero ───────────────────────────────────────────────────────── */
.hero { position: relative; padding: clamp(56px, 9vh, 110px) 0 24px; }
.hero .kicker { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 26px; }
.hero h1 {
  font-size: clamp(44px, 8.2vw, 104px);
  letter-spacing: -0.03em;
  line-height: 0.98;
  max-width: 11ch;
}
.hero .h1-wrap { position: relative; display: inline-block; }
.hero .h1-under { width: min(420px, 56%); height: 16px; margin-top: 6px; }
/* top-left tag whose down-arrow points at "Mariya" (the start of the h1) */
.hero .anno {
  position: absolute;
  left: 4px;
  top: -24px;
  display: flex;
  align-items: flex-end;
  gap: 5px;
  rotate: -5deg;
}
.hero .anno .doodle { width: 20px; height: 26px; }
.hero .lede {
  max-width: 60ch;
  margin-top: 28px;
  font-size: clamp(16px, 1.6vw, 19px);
  color: var(--ink-soft);
}
.hero .lede b { color: var(--ink); font-weight: 600; }
/* The hero's availability mark. Same red stamp as a project status, scaled up
   and straightened a little: at 10.5px and -2.5deg it read as a caption down
   here rather than the headline claim it is. */
.hero .avail { margin-top: 26px; }
.stamp--avail { font-size: 13px; letter-spacing: 0.15em; padding: 10px 17px 9px; rotate: -1.5deg; opacity: 1; }
@media (max-width: 560px) { .stamp--avail { font-size: 11.5px; letter-spacing: 0.12em; padding: 9px 13px 8px; } }

.hero .facts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.hero .facts .hd-box { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; padding: 8px 14px; }
.hero .dimline { margin-top: 38px; max-width: 520px; }
.dimline { position: relative; }
.dimline svg { width: 100%; height: 26px; }
.dimline .dim-label {
  position: absolute;
  left: 50%;
  top: -16px;
  translate: -50% 0;
  white-space: nowrap;
}
.hero .scrollcue {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 44px;
}
.hero .scrollcue .doodle { width: 26px; height: 38px; }
.skyline { margin-top: 36px; }
.skyline svg { width: 100%; height: clamp(48px, 7vw, 80px); }
.skyline path { stroke: var(--ink); stroke-width: 2; }
.skyline .draw path { transition-duration: 2.6s; }

/* short browser windows (laptop chrome, landscape tablets): tighten the
   hero's vertical rhythm so the scroll prompt reliably clears the fold */
@media (max-height: 720px) {
  .hero { padding-top: clamp(40px, 6vh, 70px); }
  .hero .facts { margin-top: 18px; }
  .hero .dimline { margin-top: 22px; }
  .hero .scrollcue { margin-top: 24px; }
}

/* ─── Sections ───────────────────────────────────────────────────── */
.section { padding: clamp(64px, 9vh, 120px) 0 32px; scroll-margin-top: 86px; }
.section-head { display: flex; align-items: baseline; gap: 22px; margin-bottom: 40px; flex-wrap: wrap; }
.section-head .meta { flex-shrink: 0; }
.section-head h2 { font-size: clamp(30px, 4.4vw, 52px); letter-spacing: -0.025em; position: relative; }
.section-head .h2-wrap { position: relative; display: inline-block; }
.section-head .h2-under { position: absolute; left: -2px; right: -8px; bottom: -10px; height: 12px; width: calc(100% + 10px); }
.section-head .counter { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

/* ─── About ──────────────────────────────────────────────────────── */
.about-grid { display: grid; grid-template-columns: 340px 1fr; gap: clamp(28px, 5vw, 72px); align-items: start; }
.about-grid .lhs { position: sticky; top: 110px; }
.portrait-fig { position: relative; margin: 0; rotate: -1.2deg; }
.portrait-fig img { width: 100%; height: auto; border: 1.5px solid var(--ink); }
.portrait-fig .drop-cap { padding-top: 10px; }
.portrait-anno { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 10px; }
.portrait-anno .doodle { width: 44px; height: 22px; scale: -1 1; }
.about-grid .bio p { max-width: 62ch; }
.about-grid .bio p::first-letter { font-weight: 600; }
.margin-note { display: flex; align-items: center; gap: 8px; margin: 18px 0 26px; }
.margin-note .doodle { width: 40px; height: 26px; flex-shrink: 0; }

/* ─── Work / projects ────────────────────────────────────────────── */
.work-grid { display: grid; grid-template-columns: 150px 1fr; gap: 36px; align-items: start; }
.work-projects { min-width: 0; }
.work-intro-stamp { display: flex; gap: 16px; align-items: center; margin: -18px 0 30px; }
/* two brace variants (see D.bracket): the short one for wider screens, the
   original tall one on phones. display:none takes the other out of layout. */
.bracket--tall { display: none; }

.project { padding: 40px 0 28px; border-top: 1.5px dashed var(--rule); scroll-margin-top: 86px; }
.project:first-child { border-top: none; padding-top: 12px; }
.project-head { display: grid; grid-template-columns: 92px 1fr auto; gap: 22px; align-items: start; margin-bottom: 26px; }
.numbubble { position: relative; width: 76px; height: 76px; }
.numbubble svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.numbubble b {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
}
.project-head h3 { font-size: clamp(26px, 3.6vw, 44px); letter-spacing: -0.025em; }
.project-head .subtitle { color: var(--ink-soft); margin: 8px 0 0; font-size: 17px; }
.project-head .cityline { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
.project-head .right { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }

.project-meta {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 8px 22px;
  margin: 26px 0;
  padding: 20px 22px;
  border: 1.5px solid var(--ink);
  border-radius: var(--wobble-2);
  background: rgba(var(--paper-rgb), 0.7);
}
.project-meta .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); padding-top: 5px; }
.project-meta .v { font-size: 15px; color: var(--ink-soft); }

.project-notes { display: grid; grid-template-columns: 120px 1fr; gap: 22px; margin: 28px 0; }
.project-notes .body { max-width: 64ch; }
.project-notes .body p:first-child { font-size: 17.5px; color: var(--ink); }

.project-media { display: grid; gap: 26px; margin: 34px 0; }
.project-media .row { display: grid; gap: 22px; min-width: 0; }
.media-fig { margin: 0; min-width: 0; position: relative; }
.media-fig:nth-child(odd) { rotate: 0.45deg; }
.media-fig:nth-child(even) { rotate: -0.4deg; }
.media-fig { transition: rotate 0.25s ease, scale 0.25s ease; }
.media-fig:hover { rotate: 0deg; scale: 1.005; }
/* HDR gain-map stills: no transform / opacity / filter — any of those make
   the browser composite the image and flatten its gain map to SDR. Rendered
   flat and untilted; !important beats the nth-child tilt above. */
.media-fig--hdr,
.media-fig--hdr:hover { rotate: 0deg !important; scale: 1 !important; transition: none; }
.media-frame {
  position: relative;
  overflow: hidden;
  background: var(--paper-2);
  border: 1.5px solid var(--ink);
}
.media-frame img { width: 100%; height: 100%; object-fit: cover; }
.media-wide   { aspect-ratio: 16 / 10; }
.media-tall   { aspect-ratio: 4 / 5; }
.media-square { aspect-ratio: 1 / 1; }
.media-cinema { aspect-ratio: 21 / 9; }

/* ── "expand to see details" overlay on cropped, oversized stills ── */
.media-frame--expand { cursor: zoom-in; }
.media-expand {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 14px; cursor: zoom-in; z-index: 2;
}
.media-expand-veil {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(35,34,32,0.42) 0%, rgba(35,34,32,0) 46%);
  opacity: 0.85; transition: opacity 0.2s ease;
}
.media-expand-tag {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 19px; line-height: 1; color: var(--paper);
  background: var(--red); border: 1.6px solid var(--paper);
  border-radius: var(--wobble-2);
  padding: 7px 15px;
  box-shadow: 0 2px 9px rgba(35,34,32,0.28);
  transition: rotate 0.2s ease, scale 0.2s ease;
  rotate: -1.4deg;
}
.media-expand-icon { font-family: var(--sans); font-size: 15px; translate: 0 -1px; }
.media-frame--expand:hover .media-expand-veil { opacity: 1; }
.media-frame--expand:hover .media-expand-tag { rotate: 0deg; scale: 1.04; }
.media-expand:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; }

/* ── full-size 1:1 image viewer ── */
/* html, not just body, must lock: html is the page's real scroller (its
   overflow-y is auto) — locking body alone left the page scrollable behind
   the open lightbox, which read as the whole page jerking as you scrolled
   the image. */
html.lb-open, body.lb-open { overflow: hidden; }
.lightbox {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column;
  background: rgba(28,27,25,0.93);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.lightbox[hidden] { display: none; }
.lightbox-bar {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px clamp(14px, 4vw, 40px);
  background: var(--paper);
  border-bottom: 1.5px solid var(--ink);
}
.lightbox-cap { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
.lightbox-cap .lb-label {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink); font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lightbox-cap .lb-coords { color: var(--ink-faint); white-space: nowrap; }
.lightbox-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.lightbox-zoom, .lightbox-close { flex: 0 0 auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 14px; }
.lightbox-scroll {
  flex: 1 1 auto; overflow: auto;
  display: flex; align-items: flex-start; justify-content: center;
  padding: clamp(16px, 4vw, 48px);
  cursor: grab; -webkit-overflow-scrolling: touch;
  /* belt-and-suspenders with html.lb-open: once this inner scroller can't
     consume more wheel/scroll (image fits, or you're at an edge), don't let
     it chain to the page underneath. */
  overscroll-behavior: contain;
}
.lightbox-scroll.dragging { cursor: grabbing; user-select: none; }
/* 1:1 — natural pixel size, never scaled down; the container scrolls */
.lightbox-img {
  width: auto; max-width: none; height: auto; flex: 0 0 auto;
  background: var(--paper-2); box-shadow: 0 6px 30px rgba(0,0,0,0.4);
}
/* fit mode: scale to the viewer's width so a giant image reveals in reading
   order (scroll down only) instead of opening off-screen on both axes —
   the default on phones/touch (see TOUCH_OR_SMALL in app.js) */
.lightbox.lb-fit .lightbox-img { width: 100%; max-width: 100%; }

.drop-cap {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding-top: 9px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.drop-cap .t-hand { font-size: 17px; text-transform: none; letter-spacing: 0; }

/* sketchy placeholder for stills that are still to come */
.media-ph {
  display: grid;
  place-items: center;
  border: 2px dashed var(--ink-faint);
  border-radius: var(--wobble);
  background: repeating-linear-gradient(-45deg, transparent 0 14px, rgba(var(--blue-rgb), 0.05) 14px 15px);
  color: var(--ink-faint);
  text-align: center;
  padding: 18px;
}
.media-ph .t-hand { color: var(--ink-faint); }

.project-features { display: grid; grid-template-columns: 120px 1fr; gap: 22px; margin: 34px 0 8px; }
.project-features ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 32px; }
.project-features li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--ink-soft); }
.project-features li .bullet {
  /* Sized by measuring the painted glyph, not guessed: the bullet character is
     only ~0.26 of its em, so 30px yields an 8px dot against the 14px list text
     (~0.57x) — clearly bigger than the drawn tick it replaced without turning
     into a blob. 26px gave 7px and read undersized; 40px gave 11px and shouted. */
  flex: 0 0 14px;        /* a dot needs far less column than the 20px-wide tick did,
                            so the text sits closer in and the list reads tighter */
  color: var(--red);     /* the tick's stroke colour, unchanged */
  font-size: 30px;
  line-height: 23px;     /* the text's line box is 22.7px at 14px and 24.3px at 15px,
                            so this centres the dot on line one at either size */
  text-align: center;
}
.interventions ul { grid-template-columns: 1fr; }
.interventions li b { font-weight: 600; color: var(--ink); }

/* ─── Hyperlapse (HDR gain-map safe — plain <img>, no canvas) ────── */
.hyperlapse { position: relative; margin: 0; height: 165vh; }
/* offset leaves room for the "scrub me" note (top:-34) to sit clear of the
   ~64px header — that gap is the margin, the note stays above the image */
.hl-sticky { position: sticky; top: 112px; }
.hl-stage {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-height: calc(100vh - 170px);
  max-height: calc(100svh - 170px);
  background: var(--paper-2);
  border: 1.5px solid var(--ink);
}
/* One canvas, not a stack of <img>s. The frames are plain SDR now (the
   gain maps were removed from the sequence), so there is no reason to
   keep two large image layers alive and swap them — initHyperlapse()
   blits an already display-sized bitmap per frame instead, which is both
   cheaper to composite and bounded in memory. The aerial stills below
   still carry gain maps and keep their HDR treatment. */
.hl-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* HDR (see initHyperlapse): the HLG video lies exactly over the canvas
   and is only shown once it can be scrubbed. display, not opacity — any
   compositing effect on an HDR layer is a reason for a browser to flatten it. */
.hl-video {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  pointer-events: none;
}
.hl-stage.is-hdr .hl-video { display: block; }
.hl-note { position: absolute; top: -34px; right: 4px; display: flex; align-items: center; gap: 6px; z-index: 3; }
.hl-note .doodle { width: 26px; height: 32px; }
/* the tap-to-load gate and the frame counter are gone: touch now streams the
   sequence exactly like desktop, so there is nothing to gate and no count to
   announce. Their rules are removed rather than left dangling. */

/* fixed grid layer used to hold the drafting grid still during the hyperlapse
   scrub (cross-browser: iOS ignores background-attachment:fixed, honors this) */
.grid-freeze {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
  background-color: transparent;
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 160px 160px, 160px 160px, 32px 32px, 32px 32px;
}

/* ─── V3: vertical lead + NATIVE horizontal project track ────────── */
.project-lead { display: grid; gap: 22px; margin-bottom: 26px; }
.proj-notes-m, .proj-feats-m { display: none; } /* shown only on phones (≤760) */
.proj-h { position: relative; margin-top: 6px; }
.proj-h-cue { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--ink-faint); }
.proj-h-cue .t-hand { color: var(--ink-faint); font-size: 18px; }
.proj-h-cue .cue-arrow { font-size: 22px; line-height: 1; }
/* show the gesture that actually applies on this input type (see .proj-h-view
   touch handling in app.js for the same signal used to pick the real behavior) */
.proj-h-cue .cue-touch { display: none; }
@media (hover: none) and (pointer: coarse) {
  .proj-h-cue .cue-mouse { display: none; }
  .proj-h-cue .cue-touch { display: inline; }
}
/* built-in horizontal scroll progress + back-to-start (aligned under the column) */
.proj-h-foot { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
/* telegraphs how much is in the strip before you commit to panning through it */
.proj-h-count { flex: 0 0 auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
.proj-h-bar { position: relative; flex: 1; height: 12px; cursor: pointer; }
.proj-h-bar .hbar-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.proj-h-bar .hbar-svg path { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.hbar-track path { stroke: var(--rule); stroke-width: 2; }
.hbar-fill { clip-path: inset(0 100% 0 0); } /* JS reveals from the left, linearly */
.hbar-fill path { stroke: var(--red); stroke-width: 2.6; }
.proj-h-reset {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-faint); cursor: pointer; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, color 0.15s ease; white-space: nowrap;
  /* padding widens the real (tappable) button box to clear the 24px WCAG 2.2
     target-size minimum; the equal negative margin keeps its visual footprint
     — and the flex gap around it in .proj-h-foot — exactly as before. */
  padding: 10px 6px; margin: -10px -6px;
}
.proj-h-reset.show { opacity: 1; pointer-events: auto; }
.proj-h-reset:hover { color: var(--red); }
.proj-h-view {
  /* DESKTOP DEFAULT: overflow hidden, so the strip is NOT a native wheel-scroll
     container. A native horizontal scroller (overflow-x:auto) makes Chrome
     translate a VERTICAL wheel into horizontal scroll of the strip — trapping
     the page whenever the cursor is over it. With overflow hidden the vertical
     wheel just passes to the page natively (full momentum, works mid-strip and
     at the ends); horizontal panning is driven by JS instead (drag + a passive
     wheel handler for shift-wheel / horizontal trackpad). Touch overrides below. */
  overflow: hidden;
  margin-right: calc(50% - 50vw);  /* full-bleed: extend to the right browser edge */
  height: min(76vh, 600px);
  cursor: grab;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;        /* hide native scrollbar — the red thread is the indicator */
  /* hybrid touchscreens get this desktop branch: let horizontal touch-drags
     reach the JS pan (pointermove) while vertical swipes stay native */
  touch-action: pan-y pinch-zoom;
}
.proj-h-view:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
/* TOUCH: restore native horizontal overflow so finger-swipe panning works.
   Touch scrolling doesn't do the vertical→horizontal wheel translation, so
   there's no trap here; a vertical swipe just chains to the page as normal. */
@media (hover: none) and (pointer: coarse) {
  .proj-h-view { overflow-x: auto; touch-action: auto; }
}
.proj-h-view.dragging { cursor: grabbing; user-select: none; }
.proj-h-view::-webkit-scrollbar { display: none; }
.proj-h-track { display: flex; gap: 22px; height: 100%; align-items: stretch; width: max-content; padding-bottom: 8px; padding-right: clamp(20px, 6vw, 80px); }
.proj-h-track .reveal { opacity: 1; translate: 0 0; }
.hpanel { flex: 0 0 auto; height: 100%; box-sizing: border-box; }
/* text panels: wide + compact + scrollable so copy is never clipped */
.hpanel--text { width: min(88vw, 600px); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 2px 12px 2px 0; }
.hpanel--text .project-meta { margin: 0; padding: 15px 18px; }
.hpanel--text .project-notes { display: block; grid-template-columns: none; }
.hpanel--text .project-notes .body { max-width: none; margin-top: 8px; }
.hpanel--text .project-notes .body p { font-size: 14px; line-height: 1.52; }
.hpanel--text .project-notes .body p:first-child { font-size: 15.5px; }
.hpanel--media { width: clamp(300px, 38vw, 520px); }
.hpanel--media .media-fig { height: 100%; display: flex; flex-direction: column; margin: 0; rotate: 0deg; }
.hpanel--media .media-frame { flex: 1 1 auto; aspect-ratio: auto; min-height: 0; }
.hpanel--feats { width: min(88vw, 560px); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 2px 12px 2px 0; }
.hpanel--feats .project-features { display: block; grid-template-columns: none; margin: 0; }
.hpanel--feats .project-features ul { grid-template-columns: 1fr; gap: 10px 0; }
.hpanel--feats .project-features li { font-size: 14px; }

/* centered main column + sticky left index that lives in the page flow (bounded
   by the projects, so it scrolls away with the page at the end — not fixed) */
.work-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 900px) minmax(0, 1fr); column-gap: clamp(30px, 4.5vw, 56px); align-items: start; }
/* Pinned to the middle track. Left to auto-placement it only landed there
   while the index occupied track 1 — and between 1025px and 1300px the index
   is display:none, so the projects slid into that 20px margin track and the
   whole work section rendered as a sliver (the hyperlapse ~140px wide). */
.work-projects { min-width: 0; grid-column: 2; }
@media (max-width: 1300px) { .pnav { display: none !important; } }

/* phones: stack the track vertically — no horizontal strip */
@media (max-width: 760px) {
  /* phones: text + features read vertically (normal page flow → no scroll-trap);
     the strip carries ONLY images, swiping sideways with the next shot cropped
     at the right edge as the swipe cue. */
  .hpanel--text, .hpanel--feats { display: none; }
  .proj-notes-m, .proj-feats-m { display: block; }
  .proj-notes-m { margin: 18px 0 24px; }
  .proj-feats-m { margin: 6px 0 4px; }
  .proj-notes-m .project-notes, .proj-feats-m .project-features { display: block; grid-template-columns: none; }
  .proj-notes-m .project-notes .body { max-width: none; margin-top: 8px; }
  .proj-feats-m .project-features ul { grid-template-columns: 1fr; }
  .proj-notes-m .reveal, .proj-feats-m .reveal { opacity: 1; translate: none; }
  :lang(de) :is(p, li, .v, .role, .subtitle), :lang(uk) :is(p, li, .v, .role, .subtitle) {
    -webkit-hyphens: auto; hyphens: auto;
  }

  .proj-h-view { margin-right: 0; height: auto; }   /* content-height → no inner scroll */
  .proj-h-track { padding-right: 6vw; }
  .hpanel { height: auto; }
  .hpanel--media { width: 74vw; }                   /* < viewport → next image peeks */
  .hpanel--media .media-fig { height: auto; }
  .hpanel--media .media-frame { flex: none; aspect-ratio: 3 / 2; }
}

/* ─── Project side nav ("drawing index") ─────────────────────────── */
.pnav {
  justify-self: end;       /* sits in the left margin column, overflows into the gutter */
  align-self: start;
  position: sticky;
  top: 130px;
  width: 150px;
  z-index: 40;
}
.pnav .pnav-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
.pnav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pnav li {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 8px;
  align-items: baseline;
  padding: 7px 8px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s ease;
}
.pnav li:hover { background: var(--red-soft); }
.pnav .pnav-num { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
.pnav .pnav-title { font-size: 12.5px; line-height: 1.3; color: var(--ink-soft); }
.pnav .pnav-title em { display: block; font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint); margin-top: 2px; }
.pnav li.is-active .pnav-num { color: var(--red); font-weight: 700; }
.pnav li.is-active .pnav-title { color: var(--ink); }

/* ─── CV — drawn timeline ────────────────────────────────────────── */
.cv-block { display: grid; grid-template-columns: 170px 1fr; gap: 26px; padding: 34px 0; border-top: 1.5px dashed var(--rule); }
.cv-block:first-of-type { border-top: none; }
.cv-block .lab { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); padding-top: 6px; }
.cv-items { position: relative; display: grid; gap: 0; }
.cv-items .spine {
  position: absolute;
  left: 5px; top: 10px; bottom: 10px;
  width: 12px;
  pointer-events: none;
}
.cv-items .spine svg { width: 100%; height: 100%; }
.cv-items .spine path { stroke: var(--ink); stroke-width: 1.8; transition-duration: 1.6s; }
.cv-item {
  display: grid;
  grid-template-columns: 120px 1fr 1fr;
  gap: 18px;
  padding: 13px 0 13px 34px;
  position: relative;
  align-items: baseline;
}
.cv-item::before {
  content: "";
  position: absolute;
  left: 6px; top: 21px;
  width: 9px; height: 9px;
  border: 2px solid var(--red);
  border-radius: 50% 46% 52% 48%;
  background: var(--paper);
}
.cv-item .yr { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
.cv-item .name { font-weight: 600; font-size: 16px; white-space: pre-line; }
.cv-item .role { font-size: 14px; color: var(--ink-soft); }

.skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.skills-grid h4 { font-size: 13px; font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--ink-soft); margin-bottom: 14px; }
.skills-grid ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 9px; }
.skills-grid li {
  font-size: 13.5px;
  color: var(--ink-soft);
  border: 1.4px solid var(--ink-soft);
  border-radius: var(--wobble);
  padding: 5px 13px;
  transition: color 0.15s ease, border-color 0.15s ease, rotate 0.2s ease;
}
.skills-grid li:hover { color: var(--red); border-color: var(--red); rotate: -1deg; }

.lang-list { display: grid; gap: 14px; max-width: 560px; }
.lang-row { display: grid; grid-template-columns: 110px 1fr; gap: 2px 16px; align-items: center; }
.lang-row .name { font-weight: 600; font-size: 15px; }
.lang-row .level { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.08em; grid-column: 2; margin-top: 0; }
.lang-bar {
  position: relative;
  height: 12px;
  border: 1.4px solid var(--ink);
  border-radius: 6px 8px 7px 9px;
  overflow: hidden;
}
.lang-bar i {
  position: absolute;
  inset: 1px;
  width: 0;
  background: repeating-linear-gradient(-55deg, var(--red) 0 2.5px, transparent 2.5px 6.5px);
  transition: width 1.1s cubic-bezier(0.5, 0, 0.2, 1);
  transition-delay: var(--d, 0ms);
}
.lang-row.in .lang-bar i { width: var(--w); }

/* ─── Contact ────────────────────────────────────────────────────── */
.contact { padding-bottom: 60px; }
.contact .thanks { margin: 6px 0 10px; }
.contact .thanks .t-hand { font-size: clamp(40px, 6vw, 64px); display: inline-block; rotate: -1.5deg; }
.contact-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(28px, 5vw, 72px); align-items: start; }
.contact-grid .pitch { max-width: 46ch; color: var(--ink-soft); font-size: 17px; }
.contact-list { display: grid; gap: 4px; }
.contact-row {
  display: grid;
  grid-template-columns: 86px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 15px 4px;
  border-bottom: 1.5px dashed var(--rule);
}
.contact-row .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
.contact-row .v { font-size: 17px; font-weight: 500; word-break: break-word; }
.contact-row .v a:hover { color: var(--red); }
.contact-row .copy {
  font-family: var(--hand);
  font-size: 17px;
  color: var(--ink-faint);
  cursor: pointer;
  border: 1.4px solid transparent;
  border-radius: var(--wobble);
  padding: 2px 12px;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.contact-row .copy:hover { color: var(--red); border-color: var(--red); }
.contact-row .copy.did { color: var(--red); }
.contact-cta { margin-top: 30px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.contact-cta .hd-box { font-size: 17px; font-weight: 600; padding: 13px 26px; }
.contact-cta .doodle { width: 56px; height: 30px; }

/* ─── Colophon ───────────────────────────────────────────────────── */
.colophon {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 26px var(--gutter) 34px;
  border-top: 1.5px solid var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
  max-width: 1180px;
  margin: 40px auto 0;
}
/* same tappable-area technique as .proj-h-reset above */
.colophon button { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; padding: 10px 6px; margin: -10px -6px; }
.colophon button:hover { color: var(--red); }

/* ─── Responsive ─────────────────────────────────────────────────── */
/* The topbar has to hold name, four links, the language + theme controls and
   the "get in touch" pill. Measured with the longest labels (German and
   Ukrainian): below ~1020px the pill no longer fits — it duplicates the
   Contact link, so it goes first; below ~820px the language menu and theme
   toggle do not fit either, and the copy in the hero takes over, with its
   menu opening right-aligned so it cannot leave the screen. The negative
   margin there cancels the tap padding so the kicker row keeps its height. */
@media (max-width: 1020px) {
  .topbar nav .pill { display: none; }
}
@media (max-width: 820px) {
  .topbar-l .lang-menu, .topbar nav .tools { display: none; }
  .tools--hero { display: flex; margin: -13px -9px -13px 0; }
  .tools--hero .lang-panel { left: auto; right: 0; }
}
@media (max-width: 1024px) {
  .work-grid { grid-template-columns: 1fr; }
  .work-projects { grid-column: auto; }   /* single track here — undo the pin above */
  .pnav { display: none; }
}
@media (max-width: 900px) {
  .about-grid { grid-template-columns: 1fr; }
  .about-grid .lhs { position: static; max-width: 380px; }
  .project-media .row { grid-template-columns: 1fr !important; }
  .project-features { grid-template-columns: 1fr; }
  .project-features ul { grid-template-columns: 1fr; }
  .project-notes { grid-template-columns: 1fr; }
  .project-head { grid-template-columns: 60px 1fr; }
  .project-head .right { grid-column: 1 / -1; flex-direction: row; align-items: center; }
  .numbubble { width: 56px; height: 56px; }
  .numbubble b { font-size: 20px; }
  .cv-block { grid-template-columns: 1fr; gap: 12px; }
}
@media (max-width: 640px) {
  .topbar nav .pill { display: none; }
  .topbar nav { gap: 0; }
  /* German and Ukrainian nav labels run ~5 characters longer than the English
     set. Tighten their spacing rather than let the name beside them truncate;
     min-width keeps the two-letter "CV" a fair tap target. */
  :lang(de) .topbar, :lang(uk) .topbar { gap: 10px; }
  :lang(de) .topbar nav a, :lang(uk) .topbar nav a { padding: 13px 5px; letter-spacing: 0.05em; min-width: 26px; text-align: center; }
  .topbar nav a { padding: 13px 8px; font-size: 10px; }
  .brand .t-hand { display: none; }
  /* "Mariya Benovska" was wrapping to two lines here, doubling the sticky
     header's height. min-width:0 lets the flex item actually shrink instead
     of forcing nav to give way; nowrap+ellipsis is a last-resort clamp for
     the very narrowest phones — at normal widths the smaller font is enough
     and the name never truncates. */
  .brand { font-size: 14.5px; min-width: 0; }
  .brand > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .anno { position: static; rotate: 0deg; margin-bottom: 10px; }
  /* static positioning drops .anno into normal flow AFTER the h1 (see hero()
     markup) — it now sits below the name instead of above it, so the down-
     arrow pointed further away instead of at the name. Flip it to point up. */
  .hero .anno .doodle { scale: 1 -1; }
  /* the "…here's the range." stamp is a half-page breather, like desktop.
     Keep the brace at its natural 18:60 ratio so preserveAspectRatio="none"
     scales it uniformly — stretching it tall/thin distorted it badly. The
     half-page breathing comes from the margins, not from warping the brace. */
  .work-intro-stamp { align-items: center; margin: 14vh 0 17vh; }
  .bracket--tall { display: block; }
  .bracket--short { display: none; }
  .work-intro-stamp .doodle { width: 72px; height: 300px; flex-shrink: 0; }
  .work-intro-stamp .t-hand { min-width: 0; }
  /* the brace carries the normalized-dash "draw" effect, which under-draws on
     iOS for this stretched viewBox (same bug the CV spine had) — leaving the
     brace broken mid-stroke. Render it as one solid stroke on phones; desktop
     keeps its draw-on-scroll animation untouched. */
  .work-intro-stamp .doodle path { stroke-dasharray: none !important; stroke-dashoffset: 0 !important; }
  .cv-item { grid-template-columns: 1fr; gap: 2px; padding-left: 28px; }
  .cv-item .yr { order: -1; }
  .skills-grid { grid-template-columns: 1fr; }
  .contact-grid { grid-template-columns: 1fr; }
  .contact-row { grid-template-columns: 70px 1fr auto; }
  .contact-row .v { font-size: 15px; }
  .hl-sticky { top: 106px; }
  /* the "scrub me" note is absolutely positioned 34px ABOVE the stage, so it
     eats into whatever sits above it. Desktop has enough surrounding air for
     that; the tighter mobile stack does not, and the note crowded the project
     text. Reserve the note's own height back as margin. */
  .hyperlapse { height: 150vh; margin-top: 46px; }
  .section { scroll-margin-top: 76px; }
}
/* 360px-wide phones: the English links were 11px too wide here and the name
   beside them clipped to "Mariya Benovs…". Same tightening the longer
   languages already get at ≤640px. */
@media (max-width: 374px) {
  .topbar { gap: 10px; }
  .topbar nav a { padding: 13px 6px; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: clamp(38px, 11.5vw, 52px); }
  .hero .facts .hd-box { padding: 7px 11px; font-size: 10px; }
  .project-meta { grid-template-columns: 1fr; gap: 2px 0; }
  .project-meta .k { padding-top: 10px; }
}

/* ─── Print ──────────────────────────────────────────────────────── */
@media print {
  body { background: #fff; }
  .topbar, .progress, .pnav, .scrollcue, .hl-note { display: none !important; }
  .reveal { opacity: 1 !important; translate: 0 0 !important; }
  .draw path, .draw line, .draw circle, .draw polyline { stroke-dashoffset: 0 !important; }
  .lang-row .lang-bar i { width: var(--w) !important; }
  .hyperlapse { height: auto !important; }
  .hl-sticky { position: static !important; }
  .project { break-inside: avoid; }

  /* horizontal strips: on screen these are overflow:hidden with a fixed
     height and only reveal the rest by panning — on paper there's no "pan",
     so everything beyond the first screen-width was silently missing from
     the printout. Switch the track to wrap so every panel prints, in order. */
  .proj-h-cue, .proj-h-foot, .media-expand { display: none !important; }
  .proj-h-view { overflow: visible !important; height: auto !important; margin-right: 0 !important; }
  .proj-h-track { flex-wrap: wrap !important; width: auto !important; height: auto !important; }
  .hpanel { height: auto !important; }
  /* the media panel's height (and its image's) came from the now-removed
     fixed strip height, via a 100% chain — restore a concrete aspect-ratio
     so it doesn't collapse to 0 on paper. */
  .hpanel--media .media-fig { height: auto !important; }
  .hpanel--media .media-frame { flex: none !important; aspect-ratio: 4 / 3 !important; min-height: auto !important; }
}

/* ─── Reduced motion ─────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; translate: 0 0; transition: none; }
  .draw path, .draw line, .draw circle, .draw ellipse, .draw polyline {
    stroke-dashoffset: 0; transition: none;
  }
  .wiggle:hover { animation: none; }
  .media-fig, .media-fig:hover { rotate: 0deg; scale: 1; transition: none; }
  .lang-row .lang-bar i { transition: none; }
  .lang-row.in .lang-bar i, .lang-bar i { width: var(--w); }
}

    lede: L(
      "Die Kieler Kante is a competition masterplan developed by Cross Architecture and Karres en Brands, awarded a recognition prize. The design responds to the existing character of the site rather than building from scratch. Historic military structures are repurposed for commercial use, and the former runway geometry becomes a framework of public green corridors connecting forest to fjord. The district is organised around four water-based neighbourhoods, with waterways threading through each — giving almost every residence direct water access.",
      "Die Kieler Kante ist ein Wettbewerbs-Masterplan von Cross Architecture und Karres en Brands, ausgezeichnet mit einer Anerkennung. Der Entwurf reagiert auf den vorhandenen Charakter des Ortes, statt bei null anzufangen. Historische Militärbauten werden gewerblich umgenutzt, und die Geometrie der ehemaligen Landebahn wird zum Gerüst öffentlicher Grünkorridore, die Wald und Förde verbinden. Das Quartier gliedert sich in vier Wasserquartiere, die jeweils von Wasserläufen durchzogen sind — so erhält fast jede Wohnung direkten Zugang zum Wasser.",

  // collapses a whole structure to the page's language once, up front, so the
  // renderers below keep reading plain strings.

    if (Array.isArray(v)) return v.map(loc);
    if (v && typeof v === "object") {
      if (typeof v.en === "string") return v[LANG] != null ? v[LANG] : v.en;
      var o = {};

  /* ── JPEG decode in workers (used by the hyperlapse) ──────────────
     Chrome already decodes createImageBitmap() on a background thread. WebKit
     makes no such promise, and a 1557px JPEG is several milliseconds of
     main-thread stall — up to eight of them in flight while the page is
     trying to scroll. Decoding inside workers takes that off the scroll path
     in every browser; the bitmap comes back by transfer, not by copy.
     decode() rejects when anything is wrong (no createImageBitmap in workers,
     a worker dying), and the caller decodes on the main thread instead. */
  function makeDecodePool(size) {
    var src =
      "self.onmessage=function(e){var d=e.data,p;" +
      "try{p=d.o?createImageBitmap(d.b,d.o).catch(function(){return createImageBitmap(d.b)}):createImageBitmap(d.b)}" +
      "catch(x){p=Promise.reject(x)}" +
      "p.then(function(bm){self.postMessage({id:d.id,bm:bm},[bm])},function(){self.postMessage({id:d.id})})};";
    var workerUrl = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    var workers = [], jobs = new Map(), seq = 0, rr = 0, dead = false, ok = 0, failed = 0;
    function kill() {
      if (dead) return;
      dead = true;
      workers.forEach(function (w) { try { w.terminate(); } catch (e) {} });
      jobs.forEach(function (j) { j.rej(new Error("decode worker lost")); });
      jobs.clear();
    }
    function onMessage(e) {
      var j = jobs.get(e.data.id), bm = e.data.bm;
      if (!j) { if (bm && bm.close) bm.close(); return; }
      jobs.delete(e.data.id);
      if (bm) { ok++; j.res(bm); return; }
      j.rej(new Error("worker decode failed"));
      // never once succeeded: workers here cannot decode at all — stop paying
      // a round trip per frame to find that out again
      if (!ok && ++failed >= 3) kill();
    }
    for (var i = 0; i < size; i++) {
      var w = new Worker(workerUrl);
      w.onmessage = onMessage;
      w.onerror = kill;
      workers.push(w);
    }
    return {
      decode: function (blob, opts) {
        if (dead) return Promise.reject(new Error("decode pool unavailable"));
        return new Promise(function (res, rej) {
          var id = ++seq;
          jobs.set(id, { res: res, rej: rej });
          try { workers[rr++ % workers.length].postMessage({ id: id, b: blob, o: opts || null }); }
          catch (e) { jobs.delete(id); rej(e); }
        });
      }
    };
  }

  /* ── hyperlapse: scroll-scrubbed frame sequence on one canvas ────── */
  function initHyperlapse(figure) {
    var noop = function () {};
